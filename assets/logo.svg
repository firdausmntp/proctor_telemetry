  <rect x="1" y="1" width="254" height="254" rx="55" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Left Architectural Stem: The 'P' Backbone (White) -->
  <rect x="54" y="50" width="32" height="156" rx="16" fill="#FFFFFF"/>

  <!-- Primary Upper Bowl of 'P': Precision Language & Telemetry Loop (Royal Cobalt) -->
