<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield Container -->
  <path d="M128 22 C184 22 216 42 216 112 C216 178 156 218 128 234 C100 218 40 178 40 112 C40 42 72 22 128 22 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#accentGrad)" 
        stroke-width="3.5" 
        stroke-linejoin="round"/>

  <!-- Subtly Inset Geometric Shield Grid -->
  <path d="M128 42 C170 42 196 58 196 114 C196 166 148 198 128 212 C108 198 60 166 60 114 C60 58 86 42 128 42 Z" 
        fill="none" 
        stroke="#334155" 
        stroke-width="1.2" 
        stroke-dasharray="4 4" 
        opacity="0.6"/>

  <!-- Radar/Spatial Entropy Concentric Arcs -->
  <circle cx="128" cy="116" r="54" fill="none" stroke="#1e3a8a" stroke-width="1.5" opacity="0.4"/>
  <circle cx="128" cy="116" r="34" fill="none" stroke="#2563eb" stroke-width="1.2" opacity="0.3"/>

  <!-- Telemetry Fusion Wave / Keystroke & Focus Rhythm Line -->
  <path d="M68 128 L94 128 L104 100 L116 156 L128 80 L140 142 L150 114 L162 128 L188 128" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Spatial Nodes (Keystroke, Focus, Pointer Nodes) -->
  <circle cx="104" cy="100" r="4.5" fill="#38bdf8"/>
  <circle cx="116" cy="156" r="4.5" fill="#38bdf8"/>
  <circle cx="128" cy="80" r="6" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="140" cy="142" r="4.5" fill="#818cf8"/>
  <circle cx="150" cy="114" r="4.5" fill="#c084fc"/>

  <!-- Focus / Integrity Eye Pupil Center -->
  <circle cx="128" cy="116" r="3.5" fill="#38bdf8"/>
</svg>

