<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="ProctorTelemetry Logo">
  <defs>
    <!-- Premium Deep Oxford Slate Background -->
    <linearGradient id="ptBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
  </defs>

  <!-- Solid Architectural Squircle Base -->
  <rect width="256" height="256" rx="52" fill="url(#ptBg)"/>

  <!-- Outer Architectural Shield Geometry -->
  <path d="M 128 36
           C 168 36, 198 48, 204 88
           C 204 148, 160 196, 128 220
           C 96 196, 52 148, 52 88
           C 58 48, 88 36, 128 36 Z"
        fill="none"
        stroke="#1E293B"
        stroke-width="5"
        stroke-linejoin="round"/>

  <!-- Inner Structural Inset -->
  <path d="M 128 52
           C 158 52, 182 62, 186 94
           C 186 140, 152 178, 128 198
           C 104 178, 70 140, 70 94
           C 74 62, 98 52, 128 52 Z"
        fill="#111C33"
        stroke="#2563EB"
        stroke-width="2.5"
        stroke-linejoin="round"/>

  <!-- Multimodal Sensor Caliper (4 Anchors: Keystroke, Focus, Pointer, Work Behavior) -->
  <!-- Top Anchor (Browser Focus) -->
  <line x1="128" y1="64" x2="128" y2="82" stroke="#60A5FA" stroke-width="3" stroke-linecap="round"/>
  <!-- Bottom Anchor (Work Behavior) -->
  <line x1="128" y1="168" x2="128" y2="186" stroke="#60A5FA" stroke-width="3" stroke-linecap="round"/>
  <!-- Left Anchor (Keystroke Dynamics) -->
  <line x1="84" y1="125" x2="102" y2="125" stroke="#60A5FA" stroke-width="3" stroke-linecap="round"/>
  <!-- Right Anchor (Pointer Spatial Entropy) -->
  <line x1="154" y1="125" x2="172" y2="125" stroke="#60A5FA" stroke-width="3" stroke-linecap="round"/>

  <!-- Central Precision Telemetry Diamond & Waveform Core -->
  <polygon points="128,88 160,125 128,162 96,125"
           fill="#1E293B"
           stroke="#3B82F6"
           stroke-width="2.5"
           stroke-linejoin="round"/>

  <!-- Precision Measurement Grid Cross -->
  <circle cx="128" cy="125" r="16" fill="#1D4ED8"/>
  <circle cx="128" cy="125" r="7" fill="#FFFFFF"/>

  <!-- Academic Integrity Verification Tick -->
  <path d="M 112 125 L 123 136 L 146 113"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="3.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
